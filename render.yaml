# Render Blueprint for the CloudCare API (FastAPI in backend/).
# Render dashboard -> New -> Blueprint -> select this repo. Render asks for every
# `sync: false` value once, when the Blueprint is first created; after that, edit
# them on the service's Environment page.
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cloudcare-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render needs a full major.minor.patch version here.
      - key: PYTHON_VERSION
        value: 3.12.16
      # Supabase Dashboard -> Connect -> Session pooler (port 5432).
      - key: DATABASE_URL
        sync: false
      # Signs demo login tokens. Generated once by Render; never reuse the dev default.
      - key: JWT_SECRET
        generateValue: true
      # Public project URL; enables Supabase access-token verification.
      - key: SUPABASE_URL
        value: https://tvqmphtgtnzxhyszcdmi.supabase.co
      # Server-only. Used at startup to create the demo users in Supabase Auth.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://cloudcare.icu,https://www.cloudcare.icu,http://localhost:3000
      # Foggy's language model: gemini | ollama | none. Without a working
      # LLM_API_KEY, Foggy answers with its keyword fallback.
      - key: LLM_PROVIDER
        value: gemini
      # Gemini API key from https://aistudio.google.com/apikey. Server-only.
      - key: LLM_API_KEY
        sync: false
      # Gemini's OpenAI-compatible endpoint.
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      # Stable free-tier Flash model; GET {LLM_BASE_URL}models lists the ids a key can use.
      - key: LLM_MODEL
        value: gemini-3.6-flash
      # Local development only (an Ollama server on a developer machine). Leave
      # unset on Render.
      - key: OLLAMA_URL
        sync: false
      # Epic MyChart (docs/epic-mychart.md). Without EPIC_CLIENT_ID and
      # EPIC_TOKEN_ENCRYPTION_KEY the /epic routes answer 503.
      - key: EPIC_CLIENT_ID
        sync: false
      # Optional; only for a confidential Epic client.
      - key: EPIC_CLIENT_SECRET
        sync: false
      - key: EPIC_FHIR_BASE_URL
        value: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/R4
      - key: EPIC_STU3_BASE_URL
        value: https://fhir.epic.com/interconnect-fhir-oauth/api/FHIR/STU3
      - key: EPIC_REDIRECT_URI
        value: https://cloudcare.icu/api/auth/callback/epic
      # Optional; empty uses the default scope list.
      - key: EPIC_SCOPES
        sync: false
      # Fernet key (32 url-safe base64 bytes), so not generateValue. Create with
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: EPIC_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: EPIC_SANDBOX
        value: "true"
      # Texts and calls to the patient's own phone (docs/phone-outreach.md). Without
      # these, /outreach reports "not set up". Apply database/patient_phone.sql first.
      # Master switch: texts and calls cost money, so nothing is sent unless this is
      # "true" (or 1/on/yes), even with every key below set. Off: "paused".
      - key: OUTREACH_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # The purchased Twilio number, E.164.
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional Messaging Service SID (MG...), used instead of the From number.
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # Server-only ElevenLabs key restricted to Agents.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      # ElevenLabs -> Agents -> Phone Numbers -> the imported number's id.
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      # Who the shared demo accounts may call or text: unset or "*" = any number
      # (demo day), a comma-separated list = only those numbers, "none" = nobody.
      - key: OUTREACH_DEMO_ALLOWLIST
        sync: false
      # Seconds to wait after a phone number is set before it can be called.
      # 0 for a live demo where attendees enter their own numbers; 600 to harden.
      - key: OUTREACH_NEW_NUMBER_COOLDOWN_SECONDS
        value: "0"
      # Link put in texts.
      - key: PUBLIC_APP_URL
        value: https://cloudcare.icu
      # Inbox for the onboarding-request emails from the sales chat. Empty uses
      # support@cloudcare.icu (forwards to the whole team). Apply
      # backend/sales.sql first (it also adds the delivery columns).
      - key: SALES_LEAD_TO
        sync: false
      # Resend API key. Set: each stored onboarding request is also emailed to
      # SALES_LEAD_TO and the row is marked sent/failed. Empty: stored only.
      - key: RESEND_API_KEY
        sync: false
      # Sender for those emails (a domain verified in Resend). Empty uses
      # "CloudCare <no-reply@cloudcare.icu>".
      - key: SALES_EMAIL_FROM
        sync: false
