# Redeploys the FastAPI backend on Render when backend code changes on main.
#
# Setup (one time, needs repo admin): add a repository secret named
# RENDER_DEPLOY_HOOK_URL with the Deploy Hook URL from the Render service
# (cloudcare-api -> Settings -> Deploy Hook). Until the secret exists this
# workflow exits early without doing anything.
name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "render.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping. Use Manual Deploy in Render."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Render deploy triggered."
